# nginx Ingress — single entry point for the cluster.
# Routes: /api/* → backend:8080   /  → frontend:8080
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: loanhub
  namespace: loanhub
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: loanhub.example.com
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: frontend
                port:
                  number: 8080
